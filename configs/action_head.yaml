# Cambiare i percorsi per E1/E2/E3/E4, mantenendo il resto identico.
dataset_root: /mnt/beegfs/a.cuciniello9/datasets/robotic/vla_jepa_offline_merged
pretrained_path: /PATH/TO/E1/pretrained_model
head_init_path: /PATH/TO/DROID_OR_COMMON_HEAD/pretrained_model
head_init_seed: 1000
output_root: /mnt/beegfs/a.cuciniello9/vla-jepa/vla-jepa-workspace/checkpoints/action_head
# Split comune a tutti gli esperimenti (4 TFRecord + 2 scripted per task in validazione).
split_manifest: /mnt/beegfs/a.cuciniello9/vla_jepa_action_training/shared_split.json
seed: 1000
batch_size: 4        # Per GPU.
grad_accum: 2        # 4 GPU x 4 x 2 = 32 osservazioni per optimizer step.
epochs: 30
num_workers: 2
learning_rate: 0.0001
weight_decay: 1.0e-8
warmup_steps: 500
min_learning_rate: 1.0e-6
grad_clip_norm: 1.0
repeated_diffusion_steps: 8
log_every: 20
