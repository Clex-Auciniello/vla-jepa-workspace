# Plays Client - usa il medesimo configs/exploration.yaml per ROS, recorder e backend.
# DEFAULT SICURO: pianificazione soltanto; esecuzione reale richiede --execute.
plays:
  click_camera_name: zed_front
  camera_node_name: zed_node
  camera_calibration_path: /home/ros2_ws/src/zed_camera/zed_camera_calibration/estimated_camera_positions.yaml
  table_frame: table_1
  depth_window: 5
  preview_sync_slop_s: 0.08
  preview_timeout_s: 10.0
  # Offsets e pose ripresi da script_controller_node.py.
  pick_y_offset_m: -0.06
  move_to_initial_pose: true
  pose_before_first_inference: [-0.15552094619366708, 0.34869994018501943, 0.1532803451753288, 0.9994452044624775, 0.03161651380119412, 0.0021438049655468088, 0.010251021036213035]
  # L'osservazione finale è reale, NON una ripetizione artificiale.
  final_settle_s: 0.5
  min_frames: 8
  save_path: /opt/vla_jepa_train/data/plays_trajectories
  # Imporre durante i test il posizionamento libero degli oggetti e nessun intralcio.
  allow_experimental_execution: true
  pick_x_offset_m: 0.03

primitives:
  min_step_m: 0.02
  reach_hover_height_m: 0.08
  approach_z_offset_m: 0.0
  release_height_offset_m: 0.02
  lift_height_m: 0.15
  rotation_deg: 30.0
  grasp_quaternion_xyzw: [0.9994452044624775, 0.03161651380119412, 0.0021438049655468088, 0.010251021036213035]
  # Parametri AGGIUNTIVI ancora da tarare sul robot.
  cube_height_m: 0.04
  stack_clearance_m: 0.01
  push_standoff_m: 0.09
  push_clearance_above_table_m: 0.03
  push_approach_height_m: 0.02
  max_push_distance_m: 0.12
  # Limiti difensivi per i soli target TCP; NON sostituiscono collision checking.
  min_pose_z_m: 0.025
  max_pose_z_m: 0.60

upload:
  server_url: http://127.0.0.1:8765
  request_timeout_s: 30.0
  max_queued_uploads: 3
